name = "synthetic-salt"
description = """The two-way synthetic example with chloride through every water path: Osu_1hru's one HRU recharging the
10 ha aquifer HRU by HRU, groundwater up into its soil, a MODFLOW 6 transport model with weathering, and the river's
gains and losses carrying chloride between the aquifer and the channel. Road salt on snow and ice days, chloride in
precipitation, and a user on a well returning its water, and its chloride, through a sewer plant's point source. For the engine's tests only: every rate is a round number, not
data."""

[run]
folder = "../../runs/synthetic-salt"

[swatplus]
project = "{swatplus_refdata}/Osu_1hru"
point_sources = [{name = "wwtp", channel = "cha01"}]

[modflow6]
builder = "model:build_small"
# land at 88.5 m, the soil drain on every cell; porosity 0.25 [A], dispersivity 5 m [A], starting at 0.01 kg m-3 [A];
# weathering 1e-4 kg per m3 of aquifer a year [A]; the source the river's losses carry their chloride in by
builder_args = {top = 88.5, soil = "drn", transport = {chloride = {porosity = 0.25, dispersivity = 5.0, strt = 0.01}}, weathering = {chloride = 1e-4}, stream_sources = true}

[recharge]
source = "hru"
map = "all:hru0001"
area_rtol = 1e-6

[groundwater_to_soil]
rule = "drain"
cap = "none"
package = "soil"

[exchange]
package = "riv"
map = "all:cha01"

[transport.chloride]       # recharge and the river's losses carry the land's and the channel's chloride ([salt])

[salt.chloride]
precipitation = 0.0003     # kg m-3 (0.3 mg/L) [A]
road_salt = {rate = 0.002, share = 0.05, snowfall_mm = 1.0, precipitation_mm = 1.0, tmin_c = 0.0}  # [A]
point_sources = {wwtp = 0.08}  # kg m-3 (80 mg/L) [A]
soil_start = 0.005         # kg m-3 [A]
stream_start = 0.01        # kg m-3 [A]
conductance = {background = 60.0, slope = 3.0}  # uS/cm, uS/cm per mg/L [A]

[[wells]]
name = "pw1"
cell = [0, 5, 6]

[[users]]                  # takes in the aquifer's chloride at its well and returns it to the sewer plant's outfall
name = "plant"
component = "basinledger.testing:SyntheticUser"
config = "intake_user.toml"
withdrawal = "well:pw1"
return = "swat:point_source:wwtp"

[outputs]
channels = ["cha01"]
