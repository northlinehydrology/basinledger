[project]
name = "basinledger"
version = "0.1.0"
description = "A basin's water balanced day by day across coupled models (SWAT+, NextGen, MODFLOW 6 and water users) through BMI"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Northline Hydrology", email = "info@northlinehydrology.com" }]
dependencies = [
    "numpy>=1.26",
    "bmipy>=2.0",
    "flopy>=3.9",
    "modflowapi>=0.2",
    "swatplus-bmi>=0.2",
]
keywords = ["hydrology", "groundwater", "SWAT+", "MODFLOW 6", "NextGen", "BMI", "model coupling", "water use"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Hydrology",
]

[project.optional-dependencies]
# water-user models from the open Water Ledger packages (CoolingWaterBmi first). pyyaml: waterledger-models 3.9.0
# imports it without declaring it (docs/requests.md); 3.10.0 drops the need.
users = ["waterledger-models>=3.11", "pyyaml>=6"]
# NextGen as the surface model: reading NGIAB runs (t-route output, forcing). Below 1.7.5, netCDF4 ships wheels for
# macOS 13 and 14; 1.7.5 and later need macOS 15 or a local netCDF library to build from source.
nextgen = ["netCDF4>=1.6,<1.7.5"]

[project.urls]
Homepage = "https://github.com/northlinehydrology/basinledger"
Documentation = "https://github.com/northlinehydrology/basinledger/blob/main/docs/design.md"
Issues = "https://github.com/northlinehydrology/basinledger/issues"
Changelog = "https://github.com/northlinehydrology/basinledger/blob/main/CHANGELOG.md"
DOI = "https://doi.org/10.5281/zenodo.23967791"

[project.scripts]
basinledger = "basinledger.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "netCDF4>=1.6,<1.7.5", "waterledger-models>=3.11", "pyyaml>=6"]
examples = ["marimo>=0.9", "matplotlib>=3.8"]
# building an example's groundwater model from public data (examples/plaster-creek/groundwater)
gis = ["shapely>=2", "pyproj>=3.6", "rasterio>=1.3", "scipy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/basinledger"]

[tool.hatch.build.targets.sdist]
include = ["src/basinledger", "tests", "examples", "docs", "README.md", "LICENSE", "CHANGELOG.md", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long runs and the install test; the nightly always runs them (deselect with -m 'not slow')",
]
